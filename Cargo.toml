[package]
name = "ferrotune"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight native Spotify desktop client written in Rust (unofficial)"
license = "MIT"
repository = "https://github.com/FerroApps/Ferrotune"
default-run = "ferrotune"

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "advanced", "svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots", "rodio-backend"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring = "4.2"
secrecy = "0.10"
directories = "6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lru = "0.16"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures = "0.3"
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
protobuf = "3.7"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
flate2 = "1"
httpdate = "1"
# Already in the tree via librespot; the native engine needs Method::GET.
http = "1"
# Native engine: direct audio output (same crate librespot uses via rodio-backend).
rodio = { version = "0.17", default-features = false, features = ["vorbis"] }
# Native engine: AES-128-CTR decryption for Spotify audio files.
aes = "0.8"
ctr = "0.9"
# Native engine: HLS playlist parsing for sneaktables endpoint.
m3u8-rs = "6"
# Strict version compare for the updater (already in the tree via other crates).
semver = "1"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9"
# StatusNotifierItem tray (pure Rust over the zbus already in the tree).
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
# Renders the bundled SVG icon to ARGB pixmaps; already compiled for iced's svg.
resvg = { version = "0.45", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Fake StatusNotifierWatcher for the tray integration test (same zbus as ksni).
zbus = "5"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
